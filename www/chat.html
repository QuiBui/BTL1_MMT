<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>P2P Chat</title>
    <style>
        body { margin: 0; font-family: Arial, sans-serif; display: flex; height: 100vh; background: #e5ddd5; }
        .sidebar { width: 260px; background: white; border-right: 1px solid #ccc; display: flex; flex-direction: column; }
        .sidebar-header { padding: 15px; background: #007bff; color: white; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        .sidebar-header button { background: rgba(255,255,255,0.2); border: none; color: white; padding: 5px 10px; cursor: pointer; border-radius: 4px; font-size: 12px; }
        .peer-list { list-style: none; padding: 0; margin: 0; overflow-y: auto; flex: 1; }
        .peer-item { padding: 15px; border-bottom: 1px solid #f0f0f0; cursor: pointer; display: flex; align-items: center; }
        .peer-item:hover { background: #f9f9f9; }
        .peer-item.active { background: #e9ecef; border-left: 4px solid #007bff; font-weight: bold; }
        .status-dot { width: 10px; height: 10px; background: #28a745; border-radius: 50%; margin-right: 10px; }
        .chat-area { flex: 1; display: flex; flex-direction: column; background: #efeae2; }
        .chat-header { padding: 15px 20px; background: white; border-bottom: 1px solid #ccc; font-weight: bold; font-size: 16px; }
        .messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .msg { max-width: 60%; padding: 10px 15px; border-radius: 8px; word-wrap: break-word; line-height: 1.4; position: relative; }
        .msg.sent { background: #dcf8c6; align-self: flex-end; border-bottom-right-radius: 0; }
        .msg.recv { background: white; align-self: flex-start; border-bottom-left-radius: 0; }
        .input-area { padding: 15px 20px; background: #f0f0f0; display: flex; gap: 10px; align-items: center; }
        .input-area input { flex: 1; padding: 12px 15px; border: 1px solid #ccc; border-radius: 20px; outline: none; font-size: 14px; }
        .input-area button { padding: 10px 25px; background: #007bff; color: white; border: none; border-radius: 20px; cursor: pointer; font-weight: bold; }
        .input-area button:disabled { background: #ccc; cursor: not-allowed; }
        .sender-name { font-size: 11px; color: #555; display: block; margin-bottom: 3px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header">
            <span id="my-username">Đang tải...</span>
            <button onclick="logout()">Thoát</button>
        </div>
        <ul class="peer-list" id="peer-list">
            <li class="peer-item" id="global-room" onclick="selectGroupChat()">
                <div class="status-dot" style="background:#007bff"></div>
                <strong># Kênh Chung</strong>
            </li>
        </ul>
    </div>

    <div class="chat-area">
        <div class="chat-header" id="chat-title">Chọn một người bên trái để bắt đầu chat</div>
        <div class="messages" id="messages-container"></div>
        <div class="input-area">
            <input type="text" id="msg-input" placeholder="Nhập tin nhắn..." disabled>
            <button id="send-btn" disabled>Gửi</button>
        </div>
    </div>

    <script>
        let myUsername = "";
        let currentTargetPeer = null;
        let peersData = {};
        let isGroupMode = false;
        
        // --- QUẢN LÝ THÔNG BÁO THÔNG MINH ---
        let readMessageCounts = { 'global': 0 };
        let hasNewMessage = { 'global': false };

        async function checkSession() {
            try {
                const res = await fetch('/get-session-info');
                const data = await res.json();
                if (data.status === 'success') {
                    myUsername = data.username;
                    document.getElementById('my-username').innerText = "Chào, " + myUsername;
                    return true;
                }
            } catch(e) {}
            window.location.href = '/login.html';
            return false;
        }

        async function fetchActivePeers() {
            try {
                const res = await fetch('/get-peers', { cache: 'no-store' });
                const data = await res.json();
                if (data.peers && Object.keys(data.peers).length > 0) {
                    peersData = data.peers; 
                    renderPeerList(peersData);
                }
            } catch (e) {
                console.log("Tracker Offline - Chế độ P2P trực tiếp");
            }
        }

        function renderPeerList(peers) {
            const list = document.getElementById('peer-list');
            const globalRoom = document.getElementById('global-room'); 
            
            list.innerHTML = ""; 
            if (globalRoom) list.appendChild(globalRoom); 

            let count = 0;
            for (const [uname, info] of Object.entries(peers)) {
                if (uname === myUsername) continue; 
                count++;

                const li = document.createElement('li');
                li.className = 'peer-item';
                li.id = 'peer-' + uname;
                if (currentTargetPeer === uname && !isGroupMode) li.classList.add('active');
                
                li.innerHTML = `<div class="status-dot"></div>${uname}`;
                li.onclick = () => selectPeer(uname, info, li);
                list.appendChild(li);
            }
            if(count === 0) {
                const emptyLi = document.createElement('li');
                emptyLi.style = "padding: 15px; text-align: center; color: #888;";
                emptyLi.innerText = "Chưa có ai online";
                list.appendChild(emptyLi);
            }
            
            // Render xong thì vẽ lại các chấm đỏ ngay lập tức (Chống nhấp nháy)
            updateBadgesUI();
        }

        function selectPeer(uname, info, element) {
            isGroupMode = false;
            currentTargetPeer = uname;
            
            document.getElementById('chat-title').innerText = "Đang chat với: " + uname;
            document.getElementById('msg-input').disabled = false;
            document.getElementById('send-btn').disabled = false;
            document.getElementById('msg-input').focus();
            
            document.querySelectorAll('.peer-item').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
            
            // Xóa chấm đỏ & Đánh dấu đã đọc
            hasNewMessage[uname] = false;
            updateBadgesUI();
            
            fetch('/get-all-messages', {cache: 'no-store'}).then(res => res.json()).then(data => {
                 if (data.status === 'success' && data.p2p[uname]) {
                     readMessageCounts[uname] = data.p2p[uname].length;
                 }
            });
            
            document.getElementById('messages-container').innerHTML = "";
            loadChatHistory();
        }

        function selectGroupChat() {
            isGroupMode = true;
            currentTargetPeer = "#Chung";
            
            document.getElementById('chat-title').innerText = "Kênh Chat Chung";
            document.getElementById('msg-input').disabled = false;
            document.getElementById('send-btn').disabled = false;
            document.getElementById('msg-input').focus();
            
            document.querySelectorAll('.peer-item').forEach(el => el.classList.remove('active'));
            const globalEl = document.getElementById('global-room');
            if(globalEl) globalEl.classList.add('active');
            
            // Xóa chấm đỏ Kênh Chung & Đánh dấu đã đọc
            hasNewMessage['global'] = false;
            updateBadgesUI();
            
            fetch('/get-all-messages', {cache: 'no-store'}).then(res => res.json()).then(data => {
                 if (data.status === 'success' && data.group) {
                     readMessageCounts['global'] = data.group.length;
                 }
            });

            document.getElementById('messages-container').innerHTML = "";
            loadChatHistory();
        }

        async function checkNotifications() {
            try {
                const res = await fetch('/get-all-messages', { cache: 'no-store' });
                const data = await res.json();
                
                if (data.status === 'success') {
                    // Check kênh chung
                    let gCount = data.group.length;
                    if (isGroupMode) {
                        readMessageCounts['global'] = gCount;
                        hasNewMessage['global'] = false;
                    } else if (gCount > (readMessageCounts['global'] || 0)) {
                        hasNewMessage['global'] = true;
                    }

                    // Check chat riêng
                    for (let user in data.p2p) {
                        let pCount = data.p2p[user].length;
                        if (currentTargetPeer === user && !isGroupMode) {
                            readMessageCounts[user] = pCount;
                            hasNewMessage[user] = false;
                        } else if (pCount > (readMessageCounts[user] || 0)) {
                            hasNewMessage[user] = true;
                        }
                    }
                    updateBadgesUI();
                }
            } catch (e) {}
        }
        
        function updateBadgesUI() {
            // Cập nhật cho Kênh Chung
            let globalEl = document.getElementById('global-room');
            if (globalEl) {
                if (hasNewMessage['global']) {
                    if (!globalEl.innerHTML.includes('🔴')) {
                        globalEl.innerHTML += ' <span style="color:red; font-size:12px;" class="noti-dot">🔴 Mới</span>';
                    }
                } else {
                    globalEl.innerHTML = `<div class="status-dot" style="background:#007bff"></div><strong># Kênh Chung</strong>`;
                }
            }

            // Cập nhật cho Chat riêng
            for (let user in hasNewMessage) {
                if (user === 'global') continue;
                let el = document.getElementById('peer-' + user);
                if (el) {
                    if (hasNewMessage[user]) {
                        if (!el.innerHTML.includes('🔴')) {
                            el.innerHTML += ' <span style="color:red; font-size:12px;" class="noti-dot">🔴 Mới</span>';
                        }
                    } else {
                        if (el.innerHTML.includes('🔴')) {
                            el.innerHTML = `<div class="status-dot"></div>${user}`;
                        }
                    }
                }
            }
        }
        
        setInterval(checkNotifications, 2500);

        async function sendMessage() {
            const input = document.getElementById('msg-input');
            const text = input.value.trim();
            if (!text) return;

            input.value = ""; 
            
            try {
                if (isGroupMode) {
                    await fetch('/frontend-broadcast', {
                        method: 'POST',
                        // Bổ sung sender để Backend không nhận nhầm người
                        body: JSON.stringify({ message: text, peers: peersData, sender: myUsername })
                    });
                } else {
                    const targetInfo = peersData[currentTargetPeer];
                    await fetch('/frontend-send', {
                        method: 'POST',
                        // Bổ sung sender
                        body: JSON.stringify({ target: targetInfo, target_username: currentTargetPeer, message: text, sender: myUsername })
                    });
                }
                loadChatHistory();
            } catch (e) {
                appendMessage("sent", "❌ Lỗi mạng");
            }
        }

        document.getElementById('send-btn').addEventListener('click', sendMessage);
        document.getElementById('msg-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        async function loadChatHistory() {
            if (!currentTargetPeer) return;
            
            const url = isGroupMode ? '/get-group-history' : '/get-chat-history';
            const options = isGroupMode ? { method: 'GET', cache: 'no-store' } : {
                method: 'POST',
                body: JSON.stringify({ target_username: currentTargetPeer })
            };

            try {
                const res = await fetch(url, options);
                const data = await res.json();
                
                const container = document.getElementById('messages-container');
                const isScrolledToBottom = container.scrollHeight - container.clientHeight <= container.scrollTop + 1;
                
                container.innerHTML = "";
                if (data.messages) {
                    data.messages.forEach(m => {
                        const type = (m.from === "me" || m.from === myUsername) ? "sent" : "recv";
                        const senderLabel = (isGroupMode && type === "recv") ? `<span class="sender-name">${m.from}</span>` : "";
                        appendMessage(type, senderLabel + m.text);
                    });
                }
                
                if (isScrolledToBottom) container.scrollTop = container.scrollHeight;
            } catch(e) {}
        }

        function appendMessage(type, text) {
            const container = document.getElementById('messages-container');
            const div = document.createElement('div');
            div.className = "msg " + type;
            div.innerHTML = text; 
            container.appendChild(div);
        }

        async function logout() {
            try {
                // Gọi API dọn dẹp biến logged_in_users ở Backend để giải phóng cổng
                await fetch('/logout', {
                    method: 'POST',
                    body: JSON.stringify({ username: myUsername })
                });
            } catch (e) {
                console.log("Lỗi khi đăng xuất");
            }
            // Chuyển hướng về trang đăng nhập
            window.location.href = '/login.html';
        }

        checkSession().then(isValid => {
            if(isValid) {
                fetch('/local-register', { method: 'POST', body: JSON.stringify({username: myUsername}) });
                fetchActivePeers();
                
                setInterval(fetchActivePeers, 3000);
                setInterval(loadChatHistory, 1000); 
            }
        });
    </script>
</body>
</html>
